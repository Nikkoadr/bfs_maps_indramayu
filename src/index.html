<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Pencarian Rute Terpendek - Indramayu</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css"
    />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      #map {
        height: 100vh;
        width: 100%;
        cursor: default;
      }
      #controls {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1000;
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        width: 220px;
      }
      #controls h4 {
        margin-top: 0;
        margin-bottom: 10px;
        color: #333;
      }
      #controls button {
        width: 100%;
        padding: 10px;
        margin-bottom: 8px;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        transition: 0.3s;
      }
      #controls button:hover {
        background: #f0f0f0;
      }
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 25px;
        height: 25px;
        animation: spin 1s linear infinite;
        display: none;
        margin: 10px auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .active-button {
        background-color: #add8e6 !important;
        border-color: #3498db !important;
      }
      #info {
        font-size: 13px;
        color: #555;
        margin-top: 10px;
        line-height: 1.4;
      }
      .checkbox-container {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        cursor: pointer;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="controls">
      <h4>Kontrol Rute</h4>
      <button id="btnSetStart">1. Pilih Titik Awal</button>
      <button id="btnSetEnd">2. Pilih Titik Akhir</button>
      <button id="btnDrawObstacle">3. Gambar Rintangan</button>
      <hr />
      <label class="checkbox-container">
        <input type="checkbox" id="chkShowNodes" /> Tampilkan Node (Titik)
      </label>
      <hr />
      <button
        id="btnFindRoute"
        style="
          background-color: #4caf50;
          color: white;
          font-weight: bold;
          border: none;
        "
      >
        4. CARI RUTE
      </button>
      <button id="btnReset">Reset Map</button>
      <div id="loader" class="loader"></div>
      <div id="info"></div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>

    <script>
      // Inisialisasi Peta
      const map = L.map("map").setView([-6.34, 108.32], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      // Icon Custom
      const startIcon = new L.Icon({
        iconUrl:
          "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png",
        shadowUrl:
          "https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png",
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41],
      });
      const endIcon = new L.Icon({
        iconUrl:
          "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png",
        shadowUrl:
          "https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png",
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41],
      });

      // State Global
      let currentMode = null;
      let startMarker = null,
        endMarker = null;
      let routeLayer = null,
        explosionLayer = null,
        finalRedPathLayer = null;
      let nodesLayer = L.layerGroup();
      let drawnItems = new L.FeatureGroup().addTo(map);

      const polygonDrawer = new L.Draw.Polygon(map, {
        shapeOptions: {
          color: "red",
          weight: 2,
          fillColor: "red",
          fillOpacity: 0.3,
        },
      });

      // Event Handling Kontrol
      document.getElementById("btnSetStart").onclick = () =>
        setMode("setStart");
      document.getElementById("btnSetEnd").onclick = () => setMode("setEnd");
      document.getElementById("btnDrawObstacle").onclick = () =>
        setMode("drawObstacle");
      document.getElementById("btnFindRoute").onclick = findRoute;
      document.getElementById("btnReset").onclick = resetMap;

      // Logika Toggle Node
      document.getElementById("chkShowNodes").onchange = function (e) {
        if (e.target.checked) {
          showNodes();
        } else {
          map.removeLayer(nodesLayer);
        }
      };

      function setMode(mode) {
        currentMode =
          currentMode === mode && mode !== "drawObstacle" ? null : mode;
        updateButtonStyles();
        polygonDrawer.disable();
        if (currentMode === "drawObstacle") polygonDrawer.enable();
      }

      function updateButtonStyles() {
        document
          .querySelectorAll("#controls button")
          .forEach((btn) => btn.classList.remove("active-button"));
        const activeBtnId = currentMode
          ? `btn${currentMode.charAt(0).toUpperCase() + currentMode.slice(1)}`
          : null;
        if (activeBtnId) {
          const btn = document.getElementById(activeBtnId);
          if (btn) btn.classList.add("active-button");
        }
        map.getContainer().style.cursor = currentMode ? "crosshair" : "default";
      }

      map.on("click", (e) => {
        if (currentMode === "setStart") {
          if (startMarker) map.removeLayer(startMarker);
          startMarker = L.marker(e.latlng, { icon: startIcon }).addTo(map);
          setMode(null);
        } else if (currentMode === "setEnd") {
          if (endMarker) map.removeLayer(endMarker);
          endMarker = L.marker(e.latlng, { icon: endIcon }).addTo(map);
          setMode(null);
        }
      });

      map.on(L.Draw.Event.CREATED, (event) => {
        drawnItems.addLayer(event.layer);
        setMode(null);
      });

      // FUNGSI TAMPILKAN SEMUA NODE
      async function showNodes() {
        if (nodesLayer.getLayers().length > 0) {
          nodesLayer.addTo(map);
          return;
        }
        document.getElementById("loader").style.display = "block";
        try {
          const response = await fetch("/api/nodes");
          const data = await response.json();
          if (data.status === "success") {
            data.nodes.forEach((node) => {
              L.circleMarker([node.lat, node.lon], {
                radius: 2,
                fillColor: "#ff7800",
                color: "#000",
                weight: 0.5,
                fillOpacity: 0.8,
              }).addTo(nodesLayer);
            });
            nodesLayer.addTo(map);
          }
        } catch (error) {
          console.error("Gagal memuat node:", error);
        } finally {
          document.getElementById("loader").style.display = "none";
        }
      }

      // FUNGSI HITUNG RUTE
      async function findRoute() {
        if (!startMarker || !endMarker) {
          alert("Pilih titik awal dan akhir di peta!");
          return;
        }
        document.getElementById("loader").style.display = "block";
        resetVisualization();

        const obstacles = drawnItems.getLayers().map((l) => l.toGeoJSON());

        try {
          const response = await fetch("/api/route", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              start_lat: startMarker.getLatLng().lat,
              start_lon: startMarker.getLatLng().lng,
              end_lat: endMarker.getLatLng().lat,
              end_lon: endMarker.getLatLng().lng,
              obstacles: obstacles,
            }),
          });
          const data = await response.json();

          if (data.status === "success") {
            document.getElementById("info").innerHTML =
              "Memulai simulasi BFS...";
            await animateExplosionAndPath(
              data.explored_segments,
              data.route_coordinates,
            );
            document.getElementById("info").innerHTML =
              `Rute ditemukan!<br>BFS Steps: ${data.distance_steps} nodes.`;
            if (routeLayer) map.fitBounds(routeLayer.getBounds());
          } else {
            document.getElementById("info").innerHTML =
              `Gagal: ${data.message}`;
          }
        } catch (error) {
          document.getElementById("info").innerHTML = `Error Server: ${error}`;
        } finally {
          document.getElementById("loader").style.display = "none";
        }
      }

      // ANIMASI LEDAKAN EXPLORATION (BFS)
      function animateExplosionAndPath(segments, pathCoords) {
        return new Promise((resolve) => {
          explosionLayer = L.layerGroup().addTo(map);
          let i = 0;
          const batchSize = Math.ceil(segments.length / 100);

          function drawExplosionBatch() {
            if (i >= segments.length) {
              setTimeout(cleanupAndDrawFinalPaths, 600);
              return;
            }
            const end = Math.min(i + batchSize, segments.length);
            for (let j = i; j < end; j++) {
              L.polyline(segments[j], {
                color: "red",
                weight: 1.5,
                opacity: 0.4,
              }).addTo(explosionLayer);
            }
            i += batchSize;
            setTimeout(drawExplosionBatch, 30);
          }

          function cleanupAndDrawFinalPaths() {
            if (explosionLayer) map.removeLayer(explosionLayer);
            explosionLayer = null;
            finalRedPathLayer = L.polyline(pathCoords, {
              color: "red",
              weight: 5,
              opacity: 0.8,
            }).addTo(map);
            setTimeout(drawBluePath, 800);
          }

          function drawBluePath() {
            if (finalRedPathLayer) map.removeLayer(finalRedPathLayer);
            finalRedPathLayer = null;
            routeLayer = L.polyline(pathCoords, {
              color: "blue",
              weight: 4,
            }).addTo(map);
            resolve();
          }

          drawExplosionBatch();
        });
      }

      function resetVisualization() {
        if (routeLayer) map.removeLayer(routeLayer);
        if (explosionLayer) map.removeLayer(explosionLayer);
        if (finalRedPathLayer) map.removeLayer(finalRedPathLayer);
        routeLayer = null;
        explosionLayer = null;
        finalRedPathLayer = null;
      }

      function resetMap() {
        if (startMarker) map.removeLayer(startMarker);
        if (endMarker) map.removeLayer(endMarker);
        resetVisualization();
        drawnItems.clearLayers();

        // Reset Node Layer
        map.removeLayer(nodesLayer);
        nodesLayer.clearLayers();
        document.getElementById("chkShowNodes").checked = false;

        startMarker = null;
        endMarker = null;
        setMode(null);
        document.getElementById("info").innerHTML = "";
        document.getElementById("loader").style.display = "none";
      }
    </script>
  </body>
</html>
